name: Experimental KMP platforms
on:
  workflow_dispatch:
  push:
    branches: [main, experiment/kmp-v2]
permissions:
  contents: read
concurrency:
  group: kmp-platforms-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Reclaim hosted Linux runner space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 platforms;android-37.2'
      - name: Install Linux keyring build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libmpv-dev mpv patchelf
      - name: Install macOS mpv
        if: runner.os == 'macOS'
        run: brew install mpv
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-mpv mingw-w64-ucrt-x86_64-binutils
      - name: Locate Windows mpv
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: echo "VIPTV_MPV_PREFIX=$(cygpath -m /ucrt64)" >> "$GITHUB_ENV"
      - name: Install native tools and Android compile platform
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - name: Verify and package desktop
        shell: bash
        run: ./gradlew :composeApp:desktopTest :composeApp:packageDistributionForCurrentOS
      - name: Verify bundled native runtime
        run: python3 tools/verify_desktop.py
      - name: Packaging diagnostics
        if: failure()
        shell: bash
        run: |
          python3 - <<'PYDIAG'
          from pathlib import Path
          for path in Path('composeApp/build/compose/logs').rglob('*-err.txt'):
              print(str(path))
              print(path.read_text(errors='replace'))
          PYDIAG
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: packaging-logs-${{ matrix.os }}
          path: composeApp/build/compose/logs
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: composeApp/build/compose/binaries/main/*/*
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Reclaim hosted Linux runner space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 platforms;android-37.2'
      - name: Prepare Android and pinned native dependencies
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          rustup target add armv7-linux-androideabi aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
          sdkmanager 'ndk;28.2.13676358'
      - name: Build Android
        run: ./gradlew -Pkotlin.compiler.execution.strategy=in-process :androidApp:assembleRelease
      - name: Check shipped ABIs
        run: python3 tools/check_apk_abis.py androidApp/build/outputs/apk/release/androidApp-release.apk armeabi-v7a,arm64-v8a,x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0'
      - name: Build Web independently
        run: ./gradlew -Pkotlin.compiler.execution.strategy=in-process :composeApp:wasmJsBrowserDistribution
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: composeApp/build/dist/wasmJs/productionExecutable
          if-no-files-found: error
