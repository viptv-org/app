name: Experimental KMP platforms
on:
  workflow_dispatch:
    inputs:
      android_only:
        description: Build only the universal Android release
        type: boolean
        default: false
      default_server:
        description: Optional HTTPS sign-in origin
        type: string
        default: ''
      cache_experiment:
        description: Android cache verification scenario
        type: choice
        options: [none, cold, kotlin, native, corrupt]
        default: none
  push:
    branches: [main, experiment/kmp-v2]
permissions:
  contents: read
  actions: read
concurrency:
  group: kmp-platforms-${{ inputs.android_only && github.run_id || github.ref }}
  cancel-in-progress: ${{ !inputs.android_only }}
jobs:
  desktop:
    if: ${{ !inputs.android_only }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      APT_PACKAGES: libdbus-1-dev libmpv2 mpv patchelf
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Reclaim hosted Linux runner space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 platforms;android-37.2'
      - name: Compute the apt deb cache key
        if: runner.os == 'Linux'
        run: bash scripts/ci/apt-cache-key.sh >> "$GITHUB_ENV"
      - name: Restore the apt deb cache
        if: runner.os == 'Linux'
        id: apt-debs
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/apt-debs
          key: ${{ env.APT_DEB_CACHE_KEY }}
      - name: Install Linux keyring build dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 12
        shell: bash
        run: bash scripts/ci/install-apt-packages.sh
      - name: Save the apt deb cache
        if: always() && runner.os == 'Linux' && steps.apt-debs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/apt-debs
          key: ${{ env.APT_DEB_CACHE_KEY }}
      - name: Install macOS mpv
        if: runner.os == 'macOS'
        run: brew install mpv ffmpeg-full
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-mpv mingw-w64-ucrt-x86_64-binutils
      - name: Locate Windows mpv
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: echo "VIPTV_MPV_PREFIX=$(cygpath -m /ucrt64)" >> "$GITHUB_ENV"
      - name: Install native tools and Android compile platform
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.11'
          cache: false
      - name: Check out the pinned torrent worker source
        shell: bash
        run: |
          git clone --quiet https://github.com/viptv-org/playback-gateway.git "$RUNNER_TEMP/playback-gateway"
          git -C "$RUNNER_TEMP/playback-gateway" cat-file -e "$(cat TORRENT_RUNTIME_REF)^{commit}"
          echo "VIPTV_PLAYBACK_GATEWAY=$RUNNER_TEMP/playback-gateway" >> "$GITHUB_ENV"
      - name: Verify and package desktop
        shell: bash
        run: ./gradlew :composeApp:desktopTest :composeApp:packageDistributionForCurrentOS
      - name: Verify bundled native runtime
        run: python3 tools/verify_desktop.py
      - name: Packaging diagnostics
        if: failure()
        shell: bash
        run: |
          python3 - <<'PYDIAG'
          from pathlib import Path
          for path in Path('composeApp/build/compose/logs').rglob('*-err.txt'):
              print(str(path))
              print(path.read_text(errors='replace'))
          PYDIAG
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: packaging-logs-${{ matrix.os }}
          path: composeApp/build/compose/logs
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: composeApp/build/compose/binaries/main/*/*
          if-no-files-found: error
  android:
    uses: ./.github/workflows/android-release.yml
    secrets:
      ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
      ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
      ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
      ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
    with:
      default_server: ${{ inputs.default_server || '' }}
      cache_experiment: ${{ inputs.cache_experiment || 'none' }}
  web:
    if: ${{ !inputs.android_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0'
      - name: Build Web independently
        run: ./gradlew -Pkotlin.compiler.execution.strategy=in-process :composeApp:wasmJsBrowserDistribution
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: composeApp/build/dist/wasmJs/productionExecutable
          if-no-files-found: error
