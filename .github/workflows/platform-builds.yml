name: Experimental KMP platforms
on:
  workflow_dispatch:
  push:
    branches: [main, experiment/kmp-v2]
permissions:
  contents: read
concurrency:
  group: kmp-platforms-${{ github.ref }}
  cancel-in-progress: true
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    # desktopTest fails 10 pixel and frame assertions on Windows and 7 on macOS; drop this when it is green there.
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Reclaim hosted Linux runner space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 platforms;android-37.2'
      - name: Install Linux keyring build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libmpv-dev mpv patchelf
      - name: Install macOS mpv
        if: runner.os == 'macOS'
        run: brew install mpv
      - uses: msys2/setup-msys2@v2
        if: runner.os == 'Windows'
        with:
          msystem: UCRT64
          install: mingw-w64-ucrt-x86_64-mpv mingw-w64-ucrt-x86_64-binutils
      - name: Locate Windows mpv
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: echo "VIPTV_MPV_PREFIX=$(cygpath -m /ucrt64)" >> "$GITHUB_ENV"
      - name: Install native tools and Android compile platform
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.11'
          cache: false
      - name: Check out the pinned torrent worker source
        shell: bash
        run: |
          git clone --quiet https://github.com/viptv-org/playback-gateway.git "$RUNNER_TEMP/playback-gateway"
          git -C "$RUNNER_TEMP/playback-gateway" cat-file -e "$(cat TORRENT_RUNTIME_REF)^{commit}"
          echo "VIPTV_PLAYBACK_GATEWAY=$RUNNER_TEMP/playback-gateway" >> "$GITHUB_ENV"
      - name: Verify and package desktop
        shell: bash
        run: ./gradlew :composeApp:packageDistributionForCurrentOS
      - name: DIAG mpv hashes
        shell: bash
        run: |
          python3 - <<'PYDIAG'
          import hashlib,json,zipfile
          from pathlib import Path
          sha=lambda b:hashlib.sha256(b).hexdigest()
          staged=Path('composeApp/build/mpvResources/mpv-runtime/darwin-aarch64') if Path('composeApp/build/mpvResources/mpv-runtime/darwin-aarch64').exists() else next(Path('composeApp/build/mpvResources/mpv-runtime').iterdir())
          print('staged',staged)
          m=json.loads((staged/'manifest.json').read_text())
          for n,d in m['files'].items():
              print('manifest',n,d[:12],'staged',sha((staged/n).read_bytes())[:12])
          for jar in Path('composeApp/build/compose/binaries/main').rglob('*.jar'):
              with zipfile.ZipFile(jar) as z:
                  for n in z.namelist():
                      if n.startswith('mpv-runtime/') and not n.endswith('/'):
                          nm=n.split('/')[-1]
                          print(jar.name,n,sha(z.read(n))[:12],'manifest',m['files'].get(nm,'-')[:12], 'size',len(z.read(n)))
          for jar in Path('composeApp/build').rglob('*.jar'):
              print('jar',jar)
          PYDIAG
      - name: Verify bundled native runtime
        run: python3 tools/verify_desktop.py
      - name: Packaging diagnostics
        if: failure()
        shell: bash
        run: |
          python3 - <<'PYDIAG'
          from pathlib import Path
          for path in Path('composeApp/build/compose/logs').rglob('*-err.txt'):
              print(str(path))
              print(path.read_text(errors='replace'))
          PYDIAG
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: packaging-logs-${{ matrix.os }}
          path: composeApp/build/compose/logs
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-${{ matrix.os }}
          path: composeApp/build/compose/binaries/main/*/*
          if-no-files-found: error
  android:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Reclaim hosted Linux runner space
        if: runner.os == 'Linux'
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 platforms;android-37.2'
      - name: Prepare Android and pinned native dependencies
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          rustup target add armv7-linux-androideabi aarch64-linux-android x86_64-linux-android
          cargo install cargo-ndk --version 4.1.2 --locked
          sdkmanager 'ndk;28.2.13676358'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.11'
          cache: false
      - name: Check out the pinned torrent worker source
        shell: bash
        run: |
          git clone --quiet https://github.com/viptv-org/playback-gateway.git "$RUNNER_TEMP/playback-gateway"
          git -C "$RUNNER_TEMP/playback-gateway" cat-file -e "$(cat TORRENT_RUNTIME_REF)^{commit}"
          echo "VIPTV_PLAYBACK_GATEWAY=$RUNNER_TEMP/playback-gateway" >> "$GITHUB_ENV"
      - name: Build Android
        run: ./gradlew -Pkotlin.compiler.execution.strategy=in-process :androidApp:assembleRelease
      - name: Android host tests
        run: ./gradlew -Pkotlin.compiler.execution.strategy=in-process :composeApp:testAndroidHostTest
      - name: Check shipped ABIs
        run: python3 tools/check_apk_abis.py androidApp/build/outputs/apk/release/androidApp-release.apk armeabi-v7a,arm64-v8a,x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error
  web:
    if: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0'
      - name: Build Web independently
        run: ./gradlew -Pkotlin.compiler.execution.strategy=in-process :composeApp:wasmJsBrowserDistribution
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: composeApp/build/dist/wasmJs/productionExecutable
          if-no-files-found: error
