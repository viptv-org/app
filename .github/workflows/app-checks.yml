name: app checks
on:
  pull_request:
    branches: [edge, main]
  push:
    branches: [edge]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: app-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  LC_ALL: C
  RUSTUP_TOOLCHAIN: 1.98.0
jobs:
  compile-android:
    name: compile Android main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Reclaim hosted Linux runner space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          gradle-home-cache-excludes: |
            caches/keyrings
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 platforms;android-37.2'
      - name: Compile Android main
        run: ./gradlew --max-workers=2 --build-cache :composeApp:compileAndroidMain
  compile-wasm:
    name: compile Wasm JS main
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Reclaim hosted Linux runner space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          gradle-home-cache-excludes: |
            caches/keyrings
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0'
      - name: Compile Wasm JS main
        run: ./gradlew --max-workers=2 --build-cache :composeApp:compileKotlinWasmJs
  desktop-test:
    name: desktop test shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Reclaim hosted Linux runner space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.11'
          cache: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
          gradle-home-cache-excludes: |
            caches/keyrings
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 platforms;android-37.2'
      - name: Install native media dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config libmpv-dev mpv patchelf
      - name: Install pinned Rust
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          rustup target add armv7-linux-androideabi aarch64-linux-android x86_64-linux-android
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/rust
          key: cargo-${{ runner.os }}-${{ hashFiles('native/core/Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-
      - name: Check out the pinned torrent worker source
        shell: bash
        run: |
          git clone --quiet https://github.com/viptv-org/playback-gateway.git "$RUNNER_TEMP/playback-gateway"
          git -C "$RUNNER_TEMP/playback-gateway" cat-file -e "$(cat TORRENT_RUNTIME_REF)^{commit}"
          echo "VIPTV_PLAYBACK_GATEWAY=$RUNNER_TEMP/playback-gateway" >> "$GITHUB_ENV"
      - name: Test desktop shard
        shell: bash
        run: |
          total=$(tools/desktop-test-shards.sh count)
          mapfile -t classes < <(SHARDS=4 SHARD=${{ matrix.shard }} tools/desktop-test-shards.sh list)
          printf 'shard %d: %d of %d desktop test classes\n' "${{ matrix.shard }}" "${#classes[@]}" "$total"
          args=()
          for class in "${classes[@]}"; do args+=(--tests "$class"); done
          ./gradlew --max-workers=2 --build-cache :composeApp:desktopTest "${args[@]}"
          python3 - "${{ matrix.shard }}" <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          shard = sys.argv[1]
          cases = sum(int(ET.parse(p).getroot().get('tests', 0)) for p in glob.glob('composeApp/build/test-results/desktopTest/*.xml'))
          print(f'shard {shard} ran {cases} test cases')
          PY
      - name: Upload desktop test results (shard ${{ matrix.shard }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-test-results-${{ matrix.shard }}
          path: composeApp/build/test-results/desktopTest
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload failed test reports (shard ${{ matrix.shard }})
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-test-reports-${{ matrix.shard }}
          path: composeApp/build/reports/tests/desktopTest
          if-no-files-found: ignore
          retention-days: 14
  checks:
    name: app checks
    runs-on: ubuntu-latest
    needs: [compile-android, compile-wasm, desktop-test]
    if: always()
    steps:
      - name: Gate on every parallel job
        shell: bash
        run: |
          results='${{ needs.compile-android.result }} ${{ needs.compile-wasm.result }} ${{ needs.desktop-test.result }}'
          echo "parallel jobs: $results"
          for result in $results; do
            if [[ "$result" != "success" ]]; then
              echo "a parallel job did not succeed: $results" >&2
              exit 1
            fi
          done